name: Initialize Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'corretto'
    
    - name: Initialize Gradle Wrapper
      run: |
        # Scarica Gradle da mirror CDN globale
        echo "Scaricando Gradle 8.2..."
        curl -L -o gradle-8.2-bin.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
        
        if [ ! -f gradle-8.2-bin.zip ]; then
          echo "Errore: download fallito"
          exit 1
        fi
        
        echo "Estraendo Gradle..."
        unzip -q gradle-8.2-bin.zip
        
        echo "Generando wrapper..."
        ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
        
        echo "Pulizia file temporanei..."
        rm -rf gradle-8.2 gradle-8.2-bin.zip
        
        echo "Verifica file creati:"
        ls -la gradle/wrapper/
        ls -la gradlew*
        
        echo "Fatto!"
    
    - name: Commit files
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add gradle/ gradlew gradlew.bat
        git commit -m "🔧 Initialize Gradle wrapper files" || echo "No changes to commit"
        git push origin main
