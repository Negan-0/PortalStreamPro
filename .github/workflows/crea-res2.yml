name: 🎨 Crea Risorse Mancanti (res + manifest fix)

on: workflow_dispatch

permissions:
  contents: write

jobs:
  crea-res2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 🔧 FIX tema (no AppCompat)
      run: |
        mkdir -p $(dirname "app/src/main/res/values/themes.xml")
        echo "" | base64 -d > "app/src/main/res/values/themes.xml"
    - name: 🆕 tema notte AMOLED
      run: |
        mkdir -p $(dirname "app/src/main/res/values-night/themes.xml")
        echo "" | base64 -d > "app/src/main/res/values-night/themes.xml"
    - name: 🆕 colore sfondo icona
      run: |
        mkdir -p $(dirname "app/src/main/res/values/launcher_colors.xml")
        echo "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxjb2xvciBuYW1lPSJpY19sYXVuY2hlcl9iYWNrZ3JvdW5kIj4jMjYzMjM4PC9jb2xvcj4KPC9yZXNvdXJjZXM+Cg==" | base64 -d > "app/src/main/res/values/launcher_colors.xml"
    - name: 🆕 traduzione IT 178 chiavi
      run: |
        mkdir -p $(dirname "app/src/main/res/values-it/strings.xml")
        echo "" | base64 -d > "app/src/main/res/values-it/strings.xml"
    - name: ðŸ†• foreground adaptive
      run: |
        mkdir -p $(dirname "app/src/main/res/drawable/ic_launcher_foreground.xml")
        echo "" | base64 -d > "app/src/main/res/drawable/ic_launcher_foreground.xml"
    - name: 🆕 adaptive icon
      run: |
        mkdir -p $(dirname "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml")
        echo "" | base64 -d > "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
    - name: 🆕 adaptive icon round
      run: |
        mkdir -p $(dirname "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml")
        echo "" | base64 -d > "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
    - name: 🆕 network security
      run: |
        mkdir -p $(dirname "app/src/main/res/xml/network_security_config.xml")
        echo "" | base64 -d > "app/src/main/res/xml/network_security_config.xml"
    - name: ðŸ†• file provider paths
      run: |
        mkdir -p $(dirname "app/src/main/res/xml/file_paths.xml")
        echo "" | base64 -d > "app/src/main/res/xml/file_paths.xml"
    - name: 🔧 FIX manifest (wiring completo)
      run: |
        mkdir -p $(dirname "app/src/main/AndroidManifest.xml")
        echo "" | base64 -d > "app/src/main/AndroidManifest.xml"
    - name: 🆕 banner TV
      run: |
        mkdir -p $(dirname "app/src/main/res/drawable-xhdpi/banner.png")
        echo "" | base64 -d > "app/src/main/res/drawable-xhdpi/banner.png"

    - name: 💾 Commit e Push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A app/src/main/res app/src/main/AndroidManifest.xml
        git commit -m "Aggiunte risorse res/ mancanti + fix tema/manifest (crea-res2)" || echo "Niente da committare"
        git push
